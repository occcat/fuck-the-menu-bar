name: CI (M1 macOS)

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-tahoe:
    name: Build & Test (M1 macOS)
    runs-on:
    - self-hosted
    - macOS
    - ARM64
    - occcat-m1
    - xcode
    steps:
    - uses: actions/checkout@v4

      with:
        persist-credentials: false
    - name: Show installed Swift toolchain
      run: |
        xcrun --find swift
        swift --version

    - name: Build
      run: swift build

    - name: Test
      run: swift test
    if: github.actor == 'occcat' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 120

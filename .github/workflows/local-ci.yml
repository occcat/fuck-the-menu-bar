name: CI (MacBook M1)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-tahoe:
    name: Build & Test (MacBook M1)
    if: github.actor == 'occcat' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, occcat-m1]
    steps:
      - uses: actions/checkout@v4

        with:
          persist-credentials: false
      - name: Show installed Swift toolchain
        run: |
          xcrun --find swift
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
    timeout-minutes: 60
